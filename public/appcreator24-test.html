function renderChips(){ $('chips').innerHTML=allCategories().slice(0,40).map(c=>`<button class="chip ${c===state.category?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');$('chips').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;renderChips();renderGrid()}); }
function matches(m,q){const hay=[title(m),m.originalTitle,m.description,m.director,...(m.cast||[]),...(m.genres||[]),...(m.categories||[])].filter(Boolean).join(' ').toLocaleLowerCase('tr');return !q||hay.includes(q)}
function renderGrid(){const q=$('search').value.trim().toLocaleLowerCase('tr');const list=state.movies.filter(m=>(state.category==='Tümü'||(m.categories||[]).includes(state.category)||(m.genres||[]).includes(state.category))&&matches(m,q));$('status').textContent=`${list.length} film · ${state.movies.length} kayıt · Kategori: ${state.category}`;$('grid').innerHTML=list.length?'':'<div class="empty">Film bulunamadı.</div>';list.forEach(m=>{const el=document.createElement('article');el.className='card';const sourceCount=frames(m).length+streams(m).length;el.innerHTML=`<img class="poster" loading="lazy" src="${esc(poster(m))}" alt="${esc(title(m))}"><div class="cardbody"><div class="title">${esc(title(m))}</div><div class="meta">${m.year||'—'} · <span class="rate">★ ${m.imdb||'—'}</span>${sourceCount?` · ${sourceCount} kaynak`:''}</div></div>${m.quality?`<span class="tag">${esc(m.quality)}</span>`:''}`;el.onclick=()=>openMovie(m);$('grid').appendChild(el)});}
function openMovie(m){state.selected=m;$('mtitle').textContent=title(m);$('mposter').src=poster(m);$('mposter').alt=title(m);$('desc').textContent=m.description||m.ozet||'Açıklama bulunamadı.';$('pagelink').href=page(m);$('badges').innerHTML=[m.year,m.imdb?`★ ${m.imdb}`:'',...(m.genres||[])].filter(Boolean).map(x=>`<span class="badge">${esc(x)}</span>`).join('');$('sources').innerHTML='';$('player').innerHTML='';const fs=frames(m),ss=streams(m);fs.forEach((x,i)=>addSource(x.className||`Iframe ${i+1}`,()=>showIframe(x),i===0));ss.forEach((x,i)=>addSource(x.name||`Akış ${i+1}`,()=>showStream(x),fs.length===0&&i===0));if(!fs.length&&!ss.length){$('note').textContent='Bu kayıtta görünür player kaynağı yok. Film sayfasını aç düğmesini kullanabilirsiniz.'}else{$('note').textContent='Player sağlayıcısı gömme iznini kapatmışsa kaynak sayfasını yeni sekmede açın.'}$('modal').classList.add('open');}
function addSource(label,fn,on){const b=document.createElement('button');b.className='btn'+(on?' on':'');b.textContent=label;b.onclick=fn;$('sources').appendChild(b);if(on)fn()}
function showIframe(x){const src=x.src||x.dataSrc;if(!src)return;$('player').innerHTML=`<iframe src="${esc(src)}" title="${esc(x.title||'Film player')}" allow="${esc(x.allow||'autoplay; fullscreen; encrypted-media; picture-in-picture')}" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`}
function showStream(x){const src=x.proxyUrl||x.m3u8Url||x.url;if(!src)return;$('player').innerHTML=`<video controls playsinline preload="metadata" src="${esc(src)}"></video>`}
async function load(){try{const r=await fetch(JSON_URL,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);state.movies=normalize(await r.json());$('status').textContent='JSON katalog yüklendi';renderChips();renderGrid()}catch(e){state.movies=normalize(window.__CATALOG__);$('status').textContent='JSON bağlantısı başarısız; gömülü katalog gösteriliyor';renderChips();renderGrid()}}
$('search').oninput=renderGrid;$('reload').onclick=load;$('close').onclick=()=>{$('modal').classList.remove('open');$('player').innerHTML=''};$('modal').onclick=e=>{if(e.target===$('modal'))$('close').click()};load();
</script>
</body>
