name: GitHub Pages Yayını

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Pages Ayarları
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Statik dosyaları hazırla
        run: |
          test -s public/index.html
          test -s public/movies.json
          printf '%s\n' "Pages build: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > public/.nojekyll

      - name: Pages artifact oluştur
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
