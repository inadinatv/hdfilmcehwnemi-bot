name: Film Kataloğunu Güncelle

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Kategori başına en fazla sayfa'
        default: '400'
      enrich:
        description: 'Detay sayfalarından zenginleştir (1/0)'
        default: '1'
      enrich_limit:
        description: 'Enrichment uygulanacak film sayısı (0=tümü)'
        default: '100'
      detail_workers:
        description: 'Detay istekleri için eşzamanlı işçi sayısı'
        default: '2'
      enrich_delay:
        description: 'Detay istekleri arasındaki saniye gecikmesi'
        default: '1'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Botu Çalıştır (tüm kategoriler)
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '400' }}
          ENRICH: ${{ github.event.inputs.enrich || '1' }}
          ENRICH_LIMIT: ${{ github.event.inputs.enrich_limit || '100' }}
          DETAIL_WORKERS: ${{ github.event.inputs.detail_workers || '2' }}
          ENRICH_DELAY: ${{ github.event.inputs.enrich_delay || '1' }}
          WORKERS: '6'
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python scraper.py

      - name: Değişiklikleri Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/movies.json
          git commit -m "🤖 Katalog güncellendi ($(date -u +'%Y-%m-%d %H:%M UTC'))" || echo "Değişiklik yok."
          git push || echo "Gönderim hatası."
